<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Isakov school</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f4f6fa;--card:#ffffff;--text:#000000;--hint:#5f6673;
  --accent:#2b62d9;--accent-t:#ffffff;--line:#dfe3ea;
  --ok:#1f9d55;--bad:#de4545;--gold:#c99a3a;--navy:#0f2148;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px 14px 96px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.hero{background:linear-gradient(135deg,#0b1730,#1b3a72);color:#fff;border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden}
.brand{font-size:12px;letter-spacing:.18em;font-weight:700;color:var(--gold)}
.hello{font-size:21px;font-weight:700;margin:6px 0 12px}
.chips{display:flex;gap:8px}
.chip{flex:1;background:rgba(255,255,255,.1);border-radius:12px;padding:8px 10px}
.chip b{display:block;font-size:19px}
.chip span{font-size:11.5px;opacity:.8}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;margin:12px 0}
.search input{flex:1;border:0;outline:0;background:none;color:var(--text);font:inherit;padding:12px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.act{background:var(--card);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px}
.act .ic{font-size:24px}
.act b{font-size:14.5px}
.act small{color:var(--hint);font-size:12px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--hint);margin:18px 4px 8px;font-weight:600}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .ic{font-size:22px;width:30px;text-align:center;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-weight:600;font-size:14.5px}
.item .tx small{color:var(--hint);font-size:12.5px}
.item .ar{color:var(--hint);font-size:18px}
.badge{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;flex:none}
.title{font-size:20px;font-weight:700;margin:6px 4px 12px}
.card{background:var(--card);border-radius:18px;padding:16px}
.btn{display:block;width:100%;background:var(--accent);color:var(--accent-t);border-radius:14px;padding:14px;font-weight:600;text-align:center;margin-top:10px}
.btn.ghost{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.mode{border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.mode.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.mode b{display:block}
.mode small{color:var(--hint);font-size:12px}
.top{display:flex;align-items:center;gap:10px;margin:2px 2px 8px}
.top .n{font-weight:700}
.top .t{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;background:var(--card);border-radius:10px;padding:4px 10px}
.top .t.low{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#5fa0ff);border-radius:6px;transition:width .3s}
.q{white-space:pre-wrap;font-size:16px;font-weight:500}
.q img{display:block;max-width:100%;border-radius:12px;margin:10px 0 0;background:#fff}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;width:100%;transition:border-color .15s,background .15s}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--line)}
.opt.sel{border-color:var(--accent)}
.opt.sel .l{background:var(--accent);color:var(--accent-t)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.opt.bad .l{background:var(--bad);color:#fff}
.wp{margin-top:12px}
.wp label{display:block;font-size:14.5px;margin-bottom:6px;white-space:pre-wrap}
.wp input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:#000;outline:0}
.wp input:focus{border-color:var(--accent)}
.wp input.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,#fff)}
.wp input.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,#fff)}
.wp .ans{font-size:13.5px;margin-top:5px}
.wtag{display:inline-block;font-size:12px;font-weight:700;color:#8a6414;background:color-mix(in srgb,var(--gold) 22%,#fff);border-radius:8px;padding:2px 8px;margin-bottom:8px}
.simc{border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;width:100%;background:var(--card);margin-bottom:10px;display:block}
.simc b{display:block;font-size:16px}.simc small{color:var(--hint);font-size:13px}
.score{background:linear-gradient(135deg,#0b1730,#1b3a72);color:#fff;border-radius:18px;padding:18px;text-align:center}
.score .big{font-size:42px;font-weight:800;line-height:1.1}
.score .lv{display:inline-block;margin-top:6px;background:var(--gold);color:#1b1300;font-weight:800;border-radius:10px;padding:4px 14px;font-size:20px}
.score small{display:block;opacity:.8;margin-top:8px;font-size:12.5px}
.brk{margin-top:12px}.brk div{display:flex;justify-content:space-between;padding:8px 2px;border-top:1px solid var(--line);font-size:14px}
.brk div:first-child{border-top:0}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:12px}
.scale span{text-align:center;font-size:11.5px;border-radius:8px;padding:5px 0;background:var(--card);color:var(--hint)}
.scale span.on{background:var(--gold);color:#1b1300;font-weight:800}
.hbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.hbar i{display:block;height:100%;border-radius:8px}
.secrow{padding:10px 0;border-top:1px solid var(--line)}.secrow:first-child{border-top:0}
.secrow .h{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.tip{background:color-mix(in srgb,var(--accent) 9%,#fff);border-radius:14px;padding:12px 14px;font-size:14.5px;margin-bottom:12px}
.tbl{overflow-x:auto;background:#fff;border-radius:14px;border:1px solid var(--line)}
.tbl table{border-collapse:collapse;font-size:13px;min-width:100%}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{background:var(--card);font-size:12px;color:var(--hint);position:sticky;top:0}
.fld{display:block;margin:10px 0}
.fld span{display:block;font-size:13px;color:var(--hint);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:#000;outline:0}
.fld textarea{min-height:220px;font-size:16px;font-family:ui-monospace,Menlo,Consolas,monospace}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tiles div{background:var(--card);border-radius:14px;padding:12px}
.tiles b{display:block;font-size:22px}.tiles small{color:var(--hint);font-size:12px}
.mini{font-size:12.5px;padding:6px 10px;border-radius:10px;background:var(--card);font-weight:600}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar div{display:flex;width:100%;max-width:640px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--hint);padding:4px 0;font-weight:600}
.tabbar button .ti{font-size:21px;filter:grayscale(1);opacity:.65}
.tabbar button.on{color:var(--accent)}.tabbar button.on .ti{filter:none;opacity:1}
body.playing .tabbar{display:none}
.qbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.qbar div{display:flex;gap:8px;width:100%;max-width:640px}
.qbar button{flex:1;height:48px;border-radius:14px;background:var(--card);font-weight:700;font-size:15px}
.qbar button.pri{flex:2;background:var(--accent);color:#fff}
.qbar button:disabled{opacity:.35}
.qbar button.fl{color:#b07d12}
.tbar{height:7px;background:var(--line);border-radius:7px;overflow:hidden;margin:2px 0 12px}
.tbar i{display:block;height:100%;border-radius:7px;transition:width .5s linear,background .5s}
.aa{background:var(--card);border-radius:10px;padding:4px 10px;font-weight:800;font-size:14px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:8;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--hint);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.st{flex:none;width:46px;text-align:center;font-size:12.5px;font-weight:800}
.prog{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:13.5px}
.q{font-size:calc(16px * var(--fs,1))}
.opt{font-size:calc(15px * var(--fs,1))}
.wp label{font-size:calc(14.5px * var(--fs,1))}
.hero,.simc.dark{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2764%27%20height%3D%2764%27%20viewBox%3D%270%200%2064%2064%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23e9c46a%27%20stroke-opacity%3D%270.22%27%20stroke-width%3D%271.4%27%3E%3Cpath%20d%3D%27M32%206%20L38%2020%20L52%2014%20L46%2028%20L60%2032%20L46%2036%20L52%2050%20L38%2044%20L32%2058%20L26%2044%20L12%2050%20L18%2036%20L4%2032%20L18%2028%20L12%2014%20L26%2020%20Z%27/%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%277%27/%3E%3Cpath%20d%3D%27M0%200%20L12%2014%20M64%200%20L52%2014%20M0%2064%20L12%2050%20M64%2064%20L52%2050%27/%3E%3C/g%3E%3C/svg%3E") 0 0/64px 64px,linear-gradient(135deg,#0b1730,#1b3a72)!important;color:#fff;border:0!important}
.chip{background:rgba(255,255,255,.13)!important}
.list,.act,.search,.card,.prog,.simc,.rev,.tbl{box-shadow:0 1px 3px rgba(20,30,60,.07),0 4px 14px rgba(20,30,60,.04)}
.list .item .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px}
.list .item:nth-child(6n+1) .ic{background:#2b62d91f}.list .item:nth-child(6n+2) .ic{background:#c0392b1f}.list .item:nth-child(6n+3) .ic{background:#b7791f1f}.list .item:nth-child(6n+4) .ic{background:#1f9d551f}.list .item:nth-child(6n+5) .ic{background:#6d4fc21f}.list .item:nth-child(6n+6) .ic{background:#0f8a8a1f}
.act .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}.row2 .act:nth-child(1) .ic{background:#b7791f1f}.row2 .act:nth-child(2) .ic{background:#1f9d551f}
.qbar button,.mini{background:#eef1f6}.qbar button.pri{background:var(--accent)}
.tbl th{background:#f4f6fa}
.tabbar,.qbar{box-shadow:0 -2px 10px rgba(0,0,0,.04)}
.climb{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(#0a1530,#1a2f63 45%,#3b4f86 80%,#6d7fb0);box-shadow:0 4px 18px rgba(10,20,50,.25)}
.climb svg{display:block;width:100%;height:auto}
.climb .node{cursor:pointer}
.chead{background:linear-gradient(135deg,#0b1730,#1b3a72);color:#fff;border-radius:20px;padding:16px;margin-bottom:12px}
.chead .alt{font-size:30px;font-weight:800;line-height:1.1}
.chead select{width:100%;margin-top:10px;font:inherit;font-size:16px;padding:9px 10px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff}
.chead select option{color:#000}
.cbar{height:8px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:10px}.cbar i{display:block;height:100%;background:linear-gradient(90deg,#3ddc84,#f3d58a)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%{r:20;opacity:.7}100%{r:34;opacity:0}}
.pulse{animation:pulse 1.6s ease-out infinite}
.mini-climb{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:linear-gradient(135deg,#0b1730,#24407a);color:#fff;width:100%;text-align:left;margin-top:12px;box-shadow:0 4px 14px rgba(10,20,50,.18)}
.mini-climb .m{font-size:34px}
.plan{background:#fff;border:2px solid #cfe0fb;border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 4px 14px rgba(20,30,60,.05)}
.plan.ok{border-color:#bfe8cf}
.plan .ph{display:flex;justify-content:space-between;align-items:baseline}
.plan .ph b{font-size:19px}.plan .ph small{color:var(--hint)}
.ptask{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line)}
.ptask .ck{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#eef1f6;color:var(--hint)}
.ptask.done .ck{background:#e3f6ea;color:var(--ok)}
.ptask b{display:block;font-size:15px}.ptask small{font-size:12.5px;color:var(--hint)}
.ptask .kind{font-weight:700}
.mcard{display:block;width:100%;text-align:left;background:#fff;border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 1px 3px rgba(20,30,60,.07),0 4px 14px rgba(20,30,60,.04)}
.mcard .mi{width:44px;height:44px;border-radius:12px;background:#fde8e8;display:grid;place-items:center;font-size:22px;margin-bottom:10px}
.rrow{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:13px 14px;border-top:1px solid var(--line)}.rrow:first-child{border-top:0}
.rrow b{font-size:15px}.rrow small{color:var(--hint);font-size:12.5px}
.subj{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px}
.subj button{flex:none;display:flex;align-items:center;gap:7px;padding:8px 14px 8px 8px;border-radius:24px;background:#fff;font-weight:700;font-size:14.5px;border:1.5px solid var(--line)}
.subj button .sl{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:#eef1f6}
.subj button.on{background:var(--accent);color:#fff;border-color:var(--accent)}.subj button.on .sl{background:rgba(255,255,255,.22)}
.subj button.add{border-style:dashed;color:var(--accent);padding-left:14px}
.srow{display:flex;align-items:center;gap:14px;padding:12px 14px;border-top:1px solid var(--line)}.srow:first-child{border-top:0}
.srow .sl{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:#eef1f6}
.srow b{display:block;font-size:15px}.srow small{color:var(--hint);font-size:12.5px}
.srow .sa{margin-left:auto;font-weight:700;color:var(--accent);font-size:14px;flex:none}
.seg{display:flex;background:#eef1f6;border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:22%;padding:10px 6px;border-radius:11px;font-weight:600;font-size:14px;color:var(--text);border:2px solid transparent}
.seg button.on{background:#fff;border-color:var(--accent);color:var(--accent)}
.sset{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,30,60,.07)}
.sset h3{margin:0;font-size:16px}.sset p{margin:2px 0 10px;color:var(--hint);font-size:12.5px}
.prev{background:var(--bg);border-radius:14px;padding:12px;margin-bottom:10px}
.tgl{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.tgl .sw{margin-left:auto;flex:none;width:50px;height:30px;border-radius:30px;background:#cfd5df;position:relative;transition:.2s}
.tgl .sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl.on .sw{background:var(--accent)}.tgl.on .sw:after{left:23px}
:root[data-theme=dark]{--bg:#0f1420;--card:#1a2130;--text:#e8ecf4;--hint:#8e98ab;--line:#2b3447;color-scheme:dark}
:root[data-theme=dark] body{background:#0f1420;color:#e8ecf4}
:root[data-theme=dark] .tabbar,:root[data-theme=dark] .qbar,:root[data-theme=dark] .sheet,:root[data-theme=dark] .plan,:root[data-theme=dark] .mcard,:root[data-theme=dark] .subj button,:root[data-theme=dark] .tbl,:root[data-theme=dark] .grid button,:root[data-theme=dark] .seg button.on{background:#1a2130}
:root[data-theme=dark] .qbar button,:root[data-theme=dark] .mini,:root[data-theme=dark] .seg,:root[data-theme=dark] .srow .sl,:root[data-theme=dark] .ptask .ck,:root[data-theme=dark] .qbar button.fl{background:#252e40}
:root[data-theme=dark] .qbar button.pri{background:var(--accent)}
:root[data-theme=dark] .wp input,:root[data-theme=dark] .fld input,:root[data-theme=dark] .fld select,:root[data-theme=dark] .fld textarea{background:#11182a;color:#e8ecf4}
:root[data-theme=dark] .q img{background:#fff}
:root[data-theme=dark] .plan{border-color:#2b4a7a}
:root[data-theme=dark] .tbl th{background:#141a28}
:root[data-theme=dark] .wtag{background:#3a2f12;color:#f3d58a}
.ptop{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;z-index:4;display:flex;align-items:center;gap:8px;background:#121a2e;color:#fff;padding:10px 12px;border-radius:0 0 14px 14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.pspace{height:62px}
.ptop .pb{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);font-size:20px;color:#fff;flex:none}
.ptop .pt{flex:1;min-width:0}.ptop .pt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}.ptop .pt small{color:#f3d58a;font-weight:700;font-variant-numeric:tabular-nums}
.ptop .pt small.low{color:#ff7b7b}
.ptop .pf{height:40px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:800;flex:none}
.ptop .py{height:40px;padding:0 16px;border-radius:12px;background:#ffd84d;color:#1b1300;font-weight:800;flex:none}
.paper{position:relative;background:#fff;color:#111;border-radius:6px;padding:22px 18px 30px;box-shadow:0 2px 14px rgba(0,0,0,.18);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
.paper .wm{position:absolute;left:50%;top:420px;transform:translateX(-50%);width:260px;height:260px;border-radius:50%;opacity:.07;background-size:cover;pointer-events:none}

<script>
const TG = window.Telegram && Telegram.WebApp;
const INIT = (TG && TG.initData) || "";
const API = "https://quizbot.yoldashaliisaqov8.workers.dev/api/";
const BASE = "../";
const $app = document.getElementById("app");
let CAT = null, ME = null, Q = null, STACK = [], TIMER = null;
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const L = "ABCDEFGH";
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

async function api(path, body) {
  if (!INIT) return null;
  try {
    const r = await fetch(API + path, { method: body ? "POST" : "GET", headers: { "X-Init-Data": INIT, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    return r.ok ? await r.json() : null;
  } catch (e) { return null; }
}
const QC = new Map();
async function getQuiz(n) {

}
// ---------- yozma javoblarni tekshirish ----------
const nrm = (s) => String(s || "").toLowerCase().replace(/[‘’ʻʼ`´'"«»“”]/g, "").replace(/ё/g, "е").replace(/[-–—.,;:!?()/]/g, " ").replace(/\s+/g, " ").trim();
function lev(a, b) { const m = a.length, n = b.length; if (Math.abs(m - n) > 2) return 9; let p = Array.from({ length: n + 1 }, (_, j) => j); for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }
function okAns(v, forms) { const x = nrm(v); if (!x) return false; return forms.some((f) => { const y = nrm(f); if (x === y) return true; const tol = y.length >= 10 ? 2 : y.length >= 5 ? 1 : 0; return tol > 0 && !/\d/.test(y) && lev(x, y) <= tol; }); }
const qOf = (d, i) => (i >= 500 ? d.written && d.written[i - 500] && { ...d.written[i - 500], w: true } : d.questions[i]);
// [olingan ball, maksimal ball]
function pts(k) { const q = Q.qs[k], p = Q.picks[k]; if (!q.w) return [p === q.ans ? 1 : 0, 1]; return [q.parts.filter((pt, j) => p && okAns(p[j], pt.a)).length, q.parts.length]; }
const qTime = (q) => { const c = cfg(), base = Q.mode === "learn" && !Q.sim && c.qt ? c.qt : Q.time; return q.w ? base * 3 : base; };

const allTests = () => CAT.sections.flatMap((s) => s.tests.map((t) => ({ ...t, sec: s })));
const secOf = (n) => CAT.sections.find((s) => s.tests.some((t) => t.n === n));
const locked = (secId) => ME && ME.locked && (ME.locked.includes("*") || ME.locked.includes(secId));

// ---------- navigatsiya ----------
function go(fn, ...a) { stopTimer(); STACK.push([fn, a]); fn(...a); window.scrollTo(0, 0); syncBack(); }

function home() { stopTimer(); STACK = []; CURTAB = "home"; go(Home); }

if (TG) { TG.ready(); TG.expand(); TG.BackButton.onClick(async () => { if (Q && Q.live && !(await ask("Testni to'xtatasizmi? Natija saqlanmaydi."))) return; if (Q) Q.live = false; back(); }); }
function applyTheme() {
  const t = cfg().theme, dark = t === "dark" || (t === "auto" && ((TG && TG.colorScheme === "dark") || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)));
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  try { TG.setHeaderColor(dark ? "#0f1420" : "#f4f6fa"); TG.setBackgroundColor(dark ? "#0f1420" : "#f4f6fa"); TG.setBottomBarColor && TG.setBottomBarColor(dark ? "#161c2a" : "#ffffff"); } catch (e) {}
}
let CURTAB = "home";
const render = (h, playing) => { $app.innerHTML = h; document.body.classList.toggle("playing", !!playing); const q = document.getElementById("qbar"); if (q && !playing) q.remove(); document.querySelectorAll("#tabbar button").forEach((b) => b.classList.toggle("on", b.dataset.t === CURTAB)); };
async function setTab(t) {

  if (Q) Q.live = false; CURTAB = t; stopTimer(); STACK = [];
  go({ home: Home, tests: Catalog, exam: SimMenu, top: Rating, res: Results, me: Profile }[t]);
}
// ---------- progress (ishlangan / boshlangan testlar) ----------
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let DONE = new Map();
const SPECIAL = (id) => ["xatolar", "kun10", "qidiruv"].includes(id) || String(id).startsWith("sim-");
function stOf(n) {
  if (DONE.has(n)) return { k: "done", p: DONE.get(n) };
  const S = LS.get("isk_st", {}); if (S[n] && Date.now() - S[n] < 14 * 86400000) return { k: "start" };
  return { k: "new" };
}
function stBadge(n) { const s = stOf(n); return s.k === "done" ? `<span class="st" style="color:${pcol(s.p)}">✅<br>${s.p}%</span>` : s.k === "start" ? `<span class="st">⏳</span>` : `<span class="st" style="opacity:.45">⚪</span>`; }
function secProg(tests) { const d = tests.filter((t) => DONE.has(t.n)).length; return [d, tests.length]; }
function progBox([d, n]) { const p = n ? Math.round((d / n) * 100) : 0; return `<div class="prog"><div style="display:flex;justify-content:space-between"><span><b>${n}</b> tadan <b>${d}</b> tasi ishlangan</span><b style="color:var(--accent)">${p}%</b></div><div class="hbar"><i style="width:${Math.max(2, p)}%;background:var(--accent)"></i></div></div>`; }
let FS = LS.get("isk_fs", 1); document.documentElement.style.setProperty("--fs", FS); applyTheme();
if (TG && TG.onEvent) TG.onEvent("themeChanged", applyTheme);
function setFs(v) { FS = v; LS.set("isk_fs", FS); document.documentElement.style.setProperty("--fs", FS); }
function bumpFs() { FS = FS >= 1.3 ? 0.9 : FS >= 1.15 ? 1.3 : FS >= 1 ? 1.15 : 1; LS.set("isk_fs", FS); document.documentElement.style.setProperty("--fs", FS); toast("Shrift: " + Math.round(FS * 100) + "%"); }

// ---------- bosh sahifa ----------
function Home() {
  const name = (ME && ME.user.name) || (TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.first_name) || "";
  const st = ME ? ME.streak : 0;
  const fire = st >= 100 ? "👑" : st >= 30 ? "💎" : "🔥";
  let h = `<div class="hero"><div class="brand">ISAKOV SCHOOL</div><div class="hello">Assalomu alaykum${name ? ", " + esc(name) : ""} 👋</div>
  <div class="chips"><div class="chip"><b>${fire} ${st}</b><span>kun ketma-ket</span></div><div class="chip"><b>${ME ? ME.stats.n : 0}</b><span>ishlangan test</span></div><div class="chip"><b>${ME ? ME.stats.avg : 0}%</b><span>o'rtacha natija</span></div></div></div>`;
  if (ME && ME.owner) h += `<button class="simc" style="margin-top:12px" onclick="go(Admin)"><b>🛠 Admin panel</b><small>Statistika, eng qiyin savollar, test qo'shish</small></button>`;
  if (!INIT) h += `<div class="warn">Ilovani bot orqali oching — shunda natijalaringiz saqlanadi va sertifikat beriladi.</div>`;
  if (ME && ME.tasks && ME.tasks.length) {
    h += `<h2>📌 Ustoz topshiriqlari</h2><div class="list">`;
    ME.tasks.forEach((t) => { const ok = t.p !== null && t.p !== undefined; h += `<button class="item" onclick="Q=null;go(Intro,'${esc(t.quiz_id)}')"><span class="ic">${ok ? "✅" : "📌"}</span><span class="tx"><b>${esc(t.title)}</b><small>${esc(t.cls)} · ${ok ? "bajarildi: " + Math.round(t.p) + "%" : "hali bajarilmagan"}</small></span><span class="ar">›</span></button>`; });
    h += `</div>`;
  }
  h += planCard() + miniClimb();
  h += `<button class="mcard" onclick="startMistakes()"><div class="mi">🔁</div><b style="font-size:16px">Xatolar ustida ishlash</b><div style="color:var(--hint);font-size:13.5px;margin-top:3px">Test shaklida, variantlar bilan</div><div style="color:var(--hint);font-size:13px;margin-top:6px">${ME && ME.mistakes ? `${ME.mistakes} ta savol, ${ME.mtopics || 1} ta mavzu` : "Hozircha xato yo'q 🎉"}</div></button>`;

// ---------- «Siz uchun bugun» kunlik reja ----------
const today = () => new Date().toDateString();
function doneToday() {
  const S = new Set(), T = LS.get("isk_today", {});
  if (T.d === today()) (T.ids || []).forEach((x) => S.add(x));
  for (const r of (ME && ME.results) || []) if (new Date(r.at).toDateString() === today()) S.add(r.quiz_id);
  return S;
}
function markToday(id) { const T = LS.get("isk_today", {}); const ids = T.d === today() ? T.ids || [] : []; if (!ids.includes(id)) ids.push(id); LS.set("isk_today", { d: today(), ids }); }
function planTasks() {
  const lvl = LS.get("isk_plan", 2), sec = curRoute(), st = sec && routeState(sec), D = doneToday(), out = [];
  if (sec) {
    const P = LS.get("isk_plan_t", {}); let n = P.d === today() ? P.n : null;
    if (!n || !sec.tests.some((t) => t.n === n)) { n = (st.tests[st.cur] || st.tests[st.tests.length - 1]).n; LS.set("isk_plan_t", { d: today(), n }); }
    const t = sec.tests.find((x) => x.n === n);
    out.push({ kind: "Mashq", col: "#2b62d9", title: t.t, sub: `${t.c} ta test, taxminan ${Math.max(5, Math.round(t.c * 0.6))} daqiqa`, done: D.has(n), go: `Q=null;go(Intro,'${n}')` });

  if (lvl >= 3 && ME && ME.mistakes) out.push({ kind: "Xatolar", col: "#de4545", title: "Xatolar ustida ishlash", sub: `${Math.min(30, ME.mistakes)} ta savol, taxminan 10 daqiqa`, done: D.has("xatolar"), go: "startMistakes()" });
  return out.slice(0, lvl === 1 ? 1 : 3);
}
function planCard() {
  const T = planTasks(), k = T.filter((x) => x.done).length, all = k === T.length, st = ME ? ME.streak : 0;
  return `<div class="plan ${all ? "ok" : ""}"><div class="ph"><b>Siz uchun bugun</b><small>${k}/${T.length} bajarildi</small></div>

  ${T.map((t) => `<button class="ptask ${t.done ? "done" : ""}" onclick="${t.go}"><span class="ck">${t.done ? "✓" : "○"}</span><span style="flex:1"><b>${esc(t.title)}</b><small><span class="kind" style="color:${t.col}">${t.kind}</span> · ${t.sub}</small></span>${t.done ? "" : '<span class="ar" style="color:var(--hint)">›</span>'}</button>`).join("")}

  const d = document.createElement("div"); d.className = "sheet-bg"; d.onclick = (e) => { if (e.target === d) d.remove(); };
  d.innerHTML = `<div class="sheet"><div class="grab"></div><b style="font-size:17px">Kunlik reja</b>
  <div class="modes" style="grid-template-columns:repeat(3,1fr)">${[[1, "🌱 Yengil", "1 vazifa"], [2, "📘 O'rtacha", "2 vazifa"], [3, "🔥 Kuchli", "3 vazifa"]].map(([v, t, s2]) => `<button class="mode ${lvl === v ? "on" : ""}" onclick="LS.set('isk_plan',${v});this.closest('.sheet-bg').remove();Home()"><b>${t}</b><small>${s2}</small></button>`).join("")}</div>

const agoMin = (t) => { const m = Math.floor((Date.now() - t) / 60000); return m < 1 ? "hozirgina" : m < 60 ? m + " daqiqa oldin" : m < 1440 ? Math.floor(m / 60) + " soat oldin" : Math.floor(m / 1440) + " kun oldin"; };

// ---------- test qo'shish formasi ----------
let DRAFT = null;
function parseTests(txt) {
  const lines = String(txt).replace(/\r/g, "").split("\n");
  const qs = []; let cur = null, last = null;
  const optRe = /^\s*([+*✔✅]\s*)?([A-Ha-hА-Еа-е])\s*[).]\s*(.*)$/;
  const qRe = /^\s*(\d{1,3})\s*[.)]\s*(.+)$/;
  const LET = "ABCDEFGH", CYR = "АБВГДЕ";
  for (let raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    let m;
    if ((m = line.match(/^(javob|to'g'ri javob|to‘g‘ri javob|ответ)\s*[:\-]\s*([A-Ha-hА-Еа-е])\b/i)) && cur) { const L1 = m[2].toUpperCase(); cur.answer = LET.includes(L1) ? LET.indexOf(L1) : CYR.indexOf(L1); last = null; continue; }
    if ((m = line.match(/^(izoh|изоҳ|пояснение|manba)\s*[:\-]\s*(.*)$/i)) && cur) { cur.explanation = (cur.explanation ? cur.explanation + " " : "") + m[2]; last = "e"; continue; }
    if ((m = line.match(qRe)) && (!cur || cur.options.length >= 2)) { cur = { q: m[2], options: [], answer: -1 }; qs.push(cur); last = "q"; continue; }
    if (cur && (m = line.match(optRe)) && (cur.options.length > 0 || /^[Aa]$|^[Аа]$/.test(m[2]))) {
      let t = m[3]; const mark = !!m[1] || /\s*(✔|✅|\(\+\)|\*)\s*$/.test(t);
      t = t.replace(/\s*(✔|✅|\(\+\)|\*)\s*$/, "");
      if (mark) cur.answer = cur.options.length;
      cur.options.push(t); last = "o"; continue;
    }
    if (cur && line.startsWith("+") && last === "q") { /* "+ variant" ko'rinishi (Word) */ cur.answer = cur.options.length; cur.options.push(line.replace(/^\+\s*/, "")); last = "o"; continue; }
    if (cur && last === "o") cur.options[cur.options.length - 1] += " " + line;
    else if (cur && last === "e") cur.explanation += " " + line;
    else if (cur) cur.q += "\n" + line;
  }
  return qs;
}

const EV_BASE = 5364, EV_TOP = 8849;
const PASS = 70;
function routeSecs() { return CAT.sections.filter((x) => x.tests.length >= 5 && x.id !== "attru" && x.id !== "yangi"); }
function curRoute() {
  const rs = routeSecs(); let id = LS.get("isk_route", null);
  if (!id || !rs.some((x) => x.id === id)) { const r = ((ME && ME.results) || []).map((x) => secOf(x.quiz_id)).find((x) => x && rs.includes(x)); id = r ? r.id : (rs.find((x) => x.id === "t6") || rs[0]).id; }
  return rs.find((x) => x.id === id);
}
function routeState(sec) {
  const tests = sec.tests, passed = tests.map((t) => (DONE.get(t.n) || 0) >= PASS);
  let cur = passed.indexOf(false); if (cur < 0) cur = tests.length;
  const done = passed.filter(Boolean).length, frac = done / tests.length;
  return { tests, passed, cur, done, frac, alt: Math.round(EV_BASE + (EV_TOP - EV_BASE) * frac) };
}
const fmtM = (m) => String(m).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " m";
function miniClimb() {
  const sec = curRoute(); if (!sec) return "";
  const st = routeState(sec);
  return `<button class="mini-climb" onclick="go(Climb)"><span class="m">🏔</span><span style="flex:1"><b style="display:block;font-size:15.5px">Cho'qqiga yo'l · ${esc(sec.title)}</b><small style="opacity:.85">${st.done}/${st.tests.length} mavzu · balandlik ${fmtM(st.alt)}</small><div class="cbar" style="margin-top:7px"><i style="width:${Math.max(3, st.frac * 100)}%"></i></div></span><span style="font-size:20px;opacity:.7">›</span></button>`;
}
function Climb() {
  const sec = curRoute(); if (!sec) return render('<div class="empty">Yo\'l topilmadi</div>');
  const st = routeState(sec), n = st.tests.length;
  const W = 360, GAP = 92, TOPPAD = 250, H = TOPPAD + n * GAP + 90;
  const P = st.tests.map((_, i) => ({ x: 180 + 105 * Math.sin(i * 0.95 + 0.4), y: H - 70 - i * GAP }));
  const S = { x: 180, y: 118 }; // cho'qqi
  const pts = [{ x: 180, y: H - 10 }, ...P, S];
  let d = `M${pts[0].x} ${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i++) { const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)]; d += ` C${(p1.x + (p2.x - p0.x) / 6).toFixed(1)} ${(p1.y + (p2.y - p0.y) / 6).toFixed(1)} ${(p2.x - (p3.x - p1.x) / 6).toFixed(1)} ${(p2.y - (p3.y - p1.y) / 6).toFixed(1)} ${p2.x} ${p2.y}`; }
  // tog'lar va manzara
  let stars = ""; for (let i = 0; i < 40; i++) stars += `<circle cx="${(i * 97) % W}" cy="${(i * 53) % 230}" r="${i % 3 ? 0.9 : 1.6}" fill="#fff" opacity="${0.3 + (i % 4) * 0.15}"/>`;
  let side = ""; for (let y = 380; y < H; y += 260) { side += `<path d="M-40 ${y + 200} L40 ${y} L120 ${y + 200}Z" fill="#20345f" opacity=".55"/><path d="M${W - 120} ${y + 330} L${W - 30} ${y + 120} L${W + 60} ${y + 330}Z" fill="#20345f" opacity=".5"/><path d="M40 ${y} L58 ${y + 40} L40 ${y + 32} L24 ${y + 36}Z" fill="#e8eefb" opacity=".55"/>`; }
  const ev = `<path d="M-30 330 L95 200 L140 230 L180 92 L222 175 L260 150 L390 330Z" fill="#2a4277"/><path d="M180 92 L203 140 L190 135 L180 150 L168 132 L156 140Z" fill="#f4f7ff"/><path d="M95 200 L110 218 L98 214 L84 218Z" fill="#dfe7f7"/><path d="M260 150 L276 172 L262 168 L248 175Z" fill="#dfe7f7"/>`;
  const flag = `<g transform="translate(180 92)"><line x1="0" y1="0" x2="0" y2="-34" stroke="#f3d58a" stroke-width="3"/><path d="M0 -34 L26 -26 L0 -18Z" fill="#e63946"/></g>`;
  // lagerlar
  const camps = [0.25, 0.5, 0.75].map((f, k) => { const i = Math.min(n - 1, Math.round(f * n) - 1); return i < 0 ? "" : `<g transform="translate(${P[i].x > 180 ? 10 : W - 96} ${P[i].y - GAP / 2})"><text font-size="20">⛺</text><text x="26" y="-2" font-size="10.5" fill="#cfd9f2" font-weight="700">${k + 2}-lager</text><text x="26" y="11" font-size="10" fill="#9fb0d6">${fmtM(Math.round(EV_BASE + (EV_TOP - EV_BASE) * ((i + 1) / n)))}</text></g>`; }).join("");
  const nodes = P.map((p, i) => {
    const t = st.tests[i], best = DONE.get(t.n), pass = st.passed[i], cur = i === st.cur;
    const fill = pass ? "#2ecc71" : best != null ? "#f0b429" : cur ? "#ffffff" : "#33497d", stroke = pass ? "#bff5d4" : cur ? "#f3d58a" : "#7d8fbf";
    const lbl = p.x > 180 ? -22 : 22, anc = p.x > 180 ? "end" : "start";
    const num = (t.t.match(/^(\d+)(?:[–-]\d+)?-mavzu/) || [])[1] || i + 1;
    const short = t.t.replace(/^\d+(?:[–-]\d+)?-mavzu\.?\s*/, "").slice(0, 26) + (t.t.length > 30 ? "…" : "");
    return `<g class="node" onclick="Q=null;go(Intro,'${t.n}')">${cur ? `<circle cx="${p.x}" cy="${p.y}" r="20" fill="none" stroke="#f3d58a" stroke-width="2" class="pulse"/>` : ""}<circle cx="${p.x}" cy="${p.y}" r="16" fill="${fill}" stroke="${stroke}" stroke-width="3"/><text x="${p.x}" y="${p.y + 4.5}" text-anchor="middle" font-size="12" font-weight="800" fill="${pass || best != null ? "#fff" : cur ? "#0b1730" : "#c9d3ee"}">${pass ? "✓" : num}</text>
      <text x="${p.x + lbl}" y="${p.y - 2}" text-anchor="${anc}" font-size="11" font-weight="700" fill="${cur ? "#fff" : "#c9d3ee"}">${esc(short)}</text><text x="${p.x + lbl}" y="${p.y + 12}" text-anchor="${anc}" font-size="10" fill="${pass ? "#8ff0b7" : best != null ? "#ffd479" : "#8fa1cc"}">${best != null ? "eng yaxshi: " + best + "%" : cur ? "keyingi qadam" : ""}</text></g>`;
  }).join("");
  const photo = TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.photo_url;
  const av = `<g id="av"><g style="animation:bob 1.4s ease-in-out infinite"><circle r="19" fill="#f3d58a"/><circle r="16" fill="#0b1730"/>${photo ? `<image href="${esc(photo)}" x="-16" y="-16" width="32" height="32" clip-path="url(#avc)" preserveAspectRatio="xMidYMid slice"/>` : `<text y="7" text-anchor="middle" font-size="20">🧗</text>`}<path d="M-6 18 L0 26 L6 18Z" fill="#f3d58a"/></g></g>`;
  const summitTxt = st.cur >= n ? `<text x="180" y="44" text-anchor="middle" font-size="16" font-weight="800" fill="#f3d58a">🎉 Cho'qqidasiz!</text>` : `<text x="180" y="44" text-anchor="middle" font-size="14" font-weight="800" fill="#f3d58a">EVEREST · ${fmtM(EV_TOP)}</text>`;
  const svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="avc"><circle r="16"/></clipPath></defs>${stars}${side}${ev}${flag}${summitTxt}
    <path id="trail" d="${d}" fill="none" stroke="#7d8fbf" stroke-width="5" stroke-dasharray="2 11" stroke-linecap="round" opacity=".8"/>
    <path id="trailDone" d="${d}" fill="none" stroke="#3ddc84" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(180 ${H - 10})"><text x="-58" y="-6" font-size="22">🏕</text><text x="-28" y="-14" font-size="11" fill="#cfd9f2" font-weight="700">Baza lageri</text><text x="-28" y="-1" font-size="10" fill="#9fb0d6">${fmtM(EV_BASE)}</text></g>
    ${camps}${nodes}${av}</svg>`;
  const nxt = st.tests[st.cur];
  render(`<div class="chead"><div style="font-size:12px;letter-spacing:.14em;color:#d6aa4c;font-weight:700">CHO'QQIGA YO'L</div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px"><div><div class="alt">${fmtM(st.alt)}</div><small style="opacity:.8">balandlik · Everest ${fmtM(EV_TOP)}</small></div><div style="text-align:right"><b style="font-size:20px">${st.done}/${n}</b><br><small style="opacity:.8">mavzu o'zlashtirildi</small></div></div>
    <div class="cbar"><i style="width:${Math.max(2, st.frac * 100)}%"></i></div>
    <select onchange="LS.set('isk_route',this.value);Climb()">${routeSecs().map((x) => `<option value="${x.id}" ${x.id === sec.id ? "selected" : ""}>${x.icon} ${esc(x.title)} (${x.tests.length})</option>`).join("")}</select></div>
    ${nxt ? `<button class="btn" style="margin:0 0 12px" onclick="Q=null;go(Intro,'${nxt.n}')">▶️ Keyingi qadam: ${esc(nxt.t.slice(0, 40))}</button>` : `<div class="note" style="margin:0 0 12px;text-align:center">🏔 Siz Everest cho'qqisiga chiqdingiz! Boshqa yo'lni tanlang.</div>`}
    <div class="climb" id="climb">${svg}</div><div style="color:var(--hint);font-size:12.5px;margin:10px 4px">Har bir mavzu — bitta qadam. Testdan ${PASS}% va undan yuqori olsangiz, keyingi qadamga chiqasiz. Mavzuni bosing — test ochiladi.</div>`);
  // yurish animatsiyasi
  const path = document.getElementById("trail"), done = document.getElementById("trailDone"), avg = document.getElementById("av");
  const total = path.getTotalLength();
  const lenAt = (pt) => { let best = 0, bd = 1e9; for (let L = 0; L <= total; L += 3) { const q = path.getPointAtLength(L), dd = (q.x - pt.x) ** 2 + (q.y - pt.y) ** 2; if (dd < bd) { bd = dd; best = L; } } return best; };
  const target = st.cur >= n ? total : st.cur === 0 ? 0 : lenAt(P[st.cur]);
  const key = "isk_pos_" + sec.id, from = Math.min(LS.get(key, target), target);
  LS.set(key, target);
  const place = (L) => { const q = path.getPointAtLength(L); avg.setAttribute("transform", `translate(${q.x} ${q.y - 26})`); done.setAttribute("stroke-dasharray", `${L} ${total}`); };

    setTimeout(() => { const step = (ts) => { if (!document.getElementById("av")) return; t0 = t0 || ts; const k = Math.min(1, (ts - t0) / dur), e = k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2; place(from + (target - from) * e); if (k < 1) requestAnimationFrame(step); else { hap("success"); if (st.cur >= n) toast("🏔 Tabriklaymiz! Siz cho'qqidasiz!"); else toast(`🧗 Yangi balandlik: ${fmtM(st.alt)}`); } }; requestAnimationFrame(step); setTimeout(() => scrollTo(target), 300); }, 500);

    h += `<div class="pq" id="pq${k}"><span class="qn">${k + 1}.</span> <span class="qt">${esc(q.q)}</span>${q.img ? `<img src="${BASE + esc(q.img)}" alt="">` : ""}`;
    if (q.w) h += `<div class="pw">${q.parts.map((pt, j) => `<div>${pt.l ? `<b>${esc(pt.l)})</b> ` : ""}${esc(pt.q)} <span class="ln">${esc((Q.picks[k] || [])[j] || "")}&nbsp;</span></div>`).join("")}</div>`;
    else { const one = q.opts.some((o) => o.length > 34); h += `<div class="po ${one ? "one" : ""}">${q.opts.map((o, j) => `<button class="${Q.picks[k] === j ? "sel" : ""}" onclick="ppick(${k},${j})"><span class="pl">${L[j]})</span> ${esc(o)}</button>`).join("")}</div>`; }
    h += `</div>`;
  });
  h += `<div style="text-align:center;color:#888;font-size:12px;font-family:Arial,sans-serif;margin-top:10px">— Test oxiri —</div></div>`;
  render(h, true);
  let qb = document.getElementById("qbar");
  if (!qb) { qb = document.createElement("nav"); qb.className = "qbar"; qb.id = "qbar"; document.body.appendChild(qb); }
  qb.innerHTML = `<div><button class="pri" onclick="ansSheet()">📝 Javob varaqasi · <span id="pcnt">${ans}/${n}</span></button></div>`;
  const tm = document.getElementById("ptm");
  const tick = () => { const left = (Q.deadline - Date.now()) / 1000; const H = Math.floor(left / 3600); tm.textContent = "⏳ " + (H ? H + ":" + String(Math.floor((left % 3600) / 60)).padStart(2, "0") + ":" + String(Math.floor(left % 60)).padStart(2, "0") : fmt(left)) + " qoldi"; tm.classList.toggle("low", left < 300); if (left <= 0) { stopTimer(); toast("⏱ Vaqt tugadi"); finish(); } };
  tick(); TIMER = setInterval(tick, 1000);
}
async function paperBack() { if (Q.live && !(await ask("Testni to'xtatasizmi? Natija saqlanmaydi."))) return; Q.live = false; back(); }
function pcount() { const e = document.getElementById("pcnt"); if (e) e.textContent = Q.picks.filter((x) => x !== null).length + "/" + Q.qs.length; }
function ppick(k, j) {
  if (!Q.live) return;
  Q.picks[k] = Q.picks[k] === j ? null : j; tap();
  document.querySelectorAll(`#pq${k} .po button`).forEach((b, i) => b.classList.toggle("sel", Q.picks[k] === i));
  document.querySelectorAll(`#ab${k} button.c`).forEach((b, i) => b.classList.toggle("on", Q.picks[k] === i));
  pcount();
}
function pwIn(k, j, v) { wIn(k, j, v); const ln = document.querySelectorAll(`#pq${k} .ln`)[j]; if (ln) ln.innerHTML = esc(v) + "&nbsp;"; pcount(); }
function ansSheet() {
  const d = document.createElement("div"); d.className = "sheet-bg"; d.onclick = (e) => { if (e.target === d) d.remove(); };
  // bo'limlarga ajratish: oddiy test, moslashtirish (A–F), yozma
  const kind = (q) => (q.w ? "w" : q.opts.length > 4 ? "m" : "t");
  const head = { t: "TEST · BITTA TO'G'RI JAVOB", m: "MOSLASHTIRISH (A–F)", w: "JAVOBNI YOZING" };
  let html = "", prev = null;
  Q.qs.forEach((q, k) => {
    const kd = kind(q);
    if (kd !== prev) {
      let e = k; while (e + 1 < Q.qs.length && kind(Q.qs[e + 1]) === kd) e++;
      html += `<div style="margin:14px 0 6px;font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--hint)">${k + 1}${e > k ? "–" + (e + 1) : ""} · ${head[kd]}</div>`;
      if (kd === "w") html += `<div style="font-size:13px;color:var(--hint);margin-bottom:6px">Javobni so'z bilan yozing: <b style="color:var(--text)">Direktoriya</b>, <b style="color:var(--text)">1847</b>, <b style="color:var(--text)">Suasson</b>. Katta-kichik harf va tutuq belgisi (o', g') muhim emas.</div>`;
      prev = kd;
    }
    if (kd === "w") html += `<div class="bub" id="ab${k}"><span class="bn" onclick="pgo(${k})">${k + 1}</span>${q.parts.map((pt, j) => `<input value="${esc((Q.picks[k] || [])[j] || "")}" placeholder="${esc(pt.l ? pt.l + ")" : "javob")}" oninput="pwIn(${k},${j},this.value)" autocomplete="off" autocapitalize="off" spellcheck="false">`).join("")}</div>`;
    else html += `<div class="bub" id="ab${k}"><span class="bn" onclick="pgo(${k})">${k + 1}</span>${q.opts.map((_, j) => `<button class="c ${Q.picks[k] === j ? "on" : ""}" onclick="ppick(${k},${j})">${L[j]}</button>`).join("")}</div>`;
  });
  d.innerHTML = `<div class="sheet"><div class="grab"></div><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">Javob varaqasi</b><small style="color:var(--hint)">raqamni bossangiz — savolga o'tadi</small></div>${html}
  <button class="btn" onclick="this.closest('.sheet-bg').remove();tryFinish()">🏁 Yakunlash</button><button class="btn ghost" onclick="this.closest('.sheet-bg').remove()">Yopish</button></div>`;
  document.body.appendChild(d);
}
function pgo(k) { document.querySelectorAll(".sheet-bg").forEach((x) => x.remove()); const el = document.getElementById("pq" + k); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: "smooth" }); }


// ---------- 🗺 Interaktiv xaritalar (Beruniy ilmi maktabi saytidan) ----------
const SITE = "https://yoldashaliisaqov8-alt.github.io/beruniy-ilmi-maktabi-/";
const MAPS = [
  ["xarita-osiyo", "🌏", "Osiyo xaritasi", "Davlatlar, poytaxtlar, tuzilgan yili · 4 xil o'yin"],
  ["xarita-yevropa", "🇪🇺", "Yevropa xaritasi", "Davlatlar, poytaxtlar va tarixiy ma'lumot"],
  ["xarita-afrika", "🌍", "Afrika xaritasi", "Davlatlar, poytaxtlar, mustaqillik yillari"],
  ["xarita-afrika-darslar", "🧭", "Afrika hududlari: 5 dars", "Mintaqalar bo'yicha bosqichma-bosqich"],
  ["xarita-amerika", "🗽", "Shimoliy Amerika xaritasi", "Davlatlar va poytaxtlar"],
  ["xarita-janubiy", "🌎", "Janubiy Amerika xaritasi", "Davlatlar va poytaxtlar"],
  ["xarita-somoniylar", "🏰", "Somoniylar davlati", "Viloyatlar va shaharlar · 7-sinf"],
  ["xarita-xiva", "🐪", "Xiva xonligining tugatilishi", "10-sinf O'zbekiston tarixi, 99–101-betlar"],
];
function Maps() {
  render(`<div class="title">🗺 Interaktiv xaritalar</div><div style="color:var(--hint);margin:-6px 4px 12px;font-size:13.5px">Davlat yoki shaharni bosing — nomi, poytaxti va tarixiy ma'lumot chiqadi. Har bir xaritada «Xaritada toping» va «Qaysi davlat?» o'yinlari bor.</div>
  <div class="list">${MAPS.map(([f, ic, t, d], i) => `<button class="item" onclick="go(MapView,${i})"><span class="ic">${ic}</span><span class="tx"><b>${t}</b><small>${d}</small></span><span class="ar">›</span></button>`).join("")}</div>`);
}
function MapView(i) {
  const [f, ic, t] = MAPS[i];
  render(`<div class="mapv"><div class="mt"><button onclick="back()">‹</button><b style="flex:1;font-size:16px">${ic} ${t}</b></div><div class="ml" id="ml">Xarita yuklanmoqda…</div><iframe id="mapf" src="${SITE + f}.html" allow="fullscreen"></iframe></div>`, true);
  const fr = document.getElementById("mapf");
  fr.onload = () => {
    const ml = document.getElementById("ml"); if (ml) ml.remove();
    try { // sayt sahifasidagi «← ISAKOV SCHOOL» kabi chiqish havolalarini yashirish
      const d = fr.contentDocument;
      d.querySelectorAll("a").forEach((a) => { if (/^\s*←/.test(a.textContent)) a.style.display = "none"; });
    } catch (e) {}
  };
}

// ---------- obuna ----------
function toBot(p) { const u = ME && ME.bot ? `https://t.me/${ME.bot}?start=${p}` : ""; if (u && TG) { TG.openTelegramLink(u); TG.close(); } }
function SubGate() {
  let h = `<div class="hero"><div class="brand">ISAKOV SCHOOL</div><div class="hello">📢 Kanalimizga obuna bo'ling</div><div style="opacity:.85">Ilovadan foydalanish uchun kanalga obuna bo'lish kerak. Kanalda yangi testlar va foydali materiallar chiqadi.</div></div><div class="list" style="margin-top:12px">`;
  ME.missing.forEach((c) => { h += `<button class="item" onclick="TG?TG.openTelegramLink('${esc(c.link)}'):open('${esc(c.link)}')"><span class="ic">📢</span><span class="tx"><b>${esc(c.name)}</b><small>Obuna bo'lish</small></span><span class="ar">›</span></button>`; });
  h += `</div><button class="btn" onclick="boot()">✅ Obuna bo'ldim — tekshirish</button>`;
  render(h, true);
}
async function refreshMe() { const m = await api("me"); if (m) { ME = m; if (m.done) for (const [n, p] of m.done) DONE.set(n, Math.max(DONE.get(n) || 0, p)); } }

async function boot() {
  render('<div class="spin"></div>');
  const [c, m] = await Promise.all([fetch(BASE + "catalog.json").then((r) => r.json()).catch(() => null), api("me")]);
  if (!c) return render('<div class="empty">Yuklanmadi. Internetni tekshirib, ilovani qayta oching.</div>');
  CAT = c; ME = m;
  if (ME && ME.extra && ME.extra.length) mergeExtra(ME.extra);
  if (ME && ME.done) DONE = new Map(ME.done);
  if (ME && ME.missing && ME.missing.length) return SubGate();
  home();
  const sp = (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || "";
  const want = (location.hash.match(/t=([\w-]+)/) || [])[1] || (sp.startsWith("t_") ? sp.slice(2) : "");
  if (want && allTests().some((x) => x.n === want)) go(Intro, want);
}
boot();
</script>
